name: Build APK Final

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Clear npm cache
        run: npm cache clean --force

      - name: Install npm dependencies (with retry)
        run: |
          npm install --no-optional --legacy-peer-deps || \
          npm install --no-optional --legacy-peer-deps || \
          npm install --no-optional --legacy-peer-deps

      - name: Install Expo CLI
        run: npm install -g expo-cli

      - name: Create .env file
        run: |
          cat > .env << 'EOF'
          DASHSCOPE_API_KEY=${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_API_HOST=${{ secrets.DASHSCOPE_API_HOST }}
          DASHSCOPE_API_ENDPOINT=${{ secrets.DASHSCOPE_API_ENDPOINT }}
          EOF

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean --non-interactive || true

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug --stacktrace

      - name: Check APK output
        run: |
          echo "Checking for APK files..."
          find android/app/build/outputs -name "*.apk" -type f 2>/dev/null || echo "No APK found"

      - name: Upload APK Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: irwcrypto-ai-apk
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          files: android/app/build/outputs/apk/**/*.apk
          tag_name: v1.0.0-build-${{ github.run_number }}
          body: |
            # IrwCrypto AI - Build ${{ github.run_number }}
            
            **Build Information:**
            - Commit: ${{ github.sha }}
            - Branch: ${{ github.ref }}
            - Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')
            
            **Features:**
            - Mining dashboard dengan status real-time
            - DashScope Qwen AI integration
            - Thermal monitoring
            - Earnings tracking
            
            **Installation:**
            Download APK dan install dengan:
            ```bash
            adb install -r irwcrypto-ai.apk
            ```
            
            **Support:**
            Email: irwan.bintangnetwork@gmail.com
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Print Summary
        if: always()
        run: |
          echo "=========================================="
          echo "Build Summary"
          echo "=========================================="
          echo "Status: ${{ job.status }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref }}"
          echo ""
          echo "Download APK:"
          echo "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "=========================================="
