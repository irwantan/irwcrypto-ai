name: Build APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo
        run: npm install -g expo-cli eas-cli

      - name: Create .env file
        run: |
          cat > .env << EOF
          DASHSCOPE_API_KEY=${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_API_HOST=${{ secrets.DASHSCOPE_API_HOST }}
          DASHSCOPE_API_ENDPOINT=${{ secrets.DASHSCOPE_API_ENDPOINT }}
          EOF

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Build APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug
        continue-on-error: true

      - name: Build APK (Release)
        run: |
          cd android
          ./gradlew assembleRelease
        continue-on-error: true

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: irwcrypto-ai-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore

      - name: Upload Release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: irwcrypto-ai-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore

      - name: Create Release
        if: success() && github.event_name == 'push'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
          tag_name: v1.0.0-${{ github.run_number }}
          body: |
            IrwCrypto AI - Build ${{ github.run_number }}
            
            **Build Details:**
            - Commit: ${{ github.sha }}
            - Branch: ${{ github.ref }}
            - Timestamp: ${{ github.event.head_commit.timestamp }}
            
            **Download APK:**
            - Debug: irwcrypto-ai-debug.apk
            - Release: irwcrypto-ai-release.apk
            
            **Installation:**
            ```bash
            adb install -r irwcrypto-ai-debug.apk
            # or
            adb install -r irwcrypto-ai-release.apk
            ```
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Status Notification
        if: always()
        run: |
          echo "Build Status: ${{ job.status }}"
          echo "Build Number: ${{ github.run_number }}"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref }}"
