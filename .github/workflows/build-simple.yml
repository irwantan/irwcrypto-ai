name: Build APK Simple

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: |
          npm ci --legacy-peer-deps
          npm install -g expo-cli

      - name: Create environment file
        run: |
          cat > .env << 'EOF'
          DASHSCOPE_API_KEY=${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_API_HOST=${{ secrets.DASHSCOPE_API_HOST }}
          DASHSCOPE_API_ENDPOINT=${{ secrets.DASHSCOPE_API_ENDPOINT }}
          EOF

      - name: Prebuild Android
        run: |
          npx expo prebuild --platform android --clean --non-interactive || true

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace || true

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace || true

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: irwcrypto-ai-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: irwcrypto-ai-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Print Build Summary
        if: always()
        run: |
          echo "=========================================="
          echo "Build Summary"
          echo "=========================================="
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Run Number: ${{ github.run_number }}"
          echo ""
          echo "APK Locations:"
          echo "- Debug: android/app/build/outputs/apk/debug/app-debug.apk"
          echo "- Release: android/app/build/outputs/apk/release/app-release.apk"
          echo ""
          echo "Download from: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "=========================================="
